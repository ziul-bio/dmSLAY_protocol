[workspace]
name = "dmSLAY_protocol"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
polars = ">=2.0.0"
seqkit = "<=2.10.0"
biopython = "1.86.*"
fastp = "1.3.*"
flexbar = "3.5.*"
r-base = ">=4.3"
r-ggplot2 = ">=3.5"
bioconductor-deseq2 = ">=1.42"

[tasks]
analyze = "bash scripts/run_analysis.sh"
merge = "bash scripts/merge_reads.sh"
trim = "bash scripts/trim_reads.sh"
count = "python scripts/count_reads.py"
deseq2 = "Rscript scripts/deseq2.r"
