[workspace]
name = "dmSLAY_protocol"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
polars = ">=2.0.0"
seqkit = "<=2.10.0"
biopython = "1.86.*"
fastp = "1.3.*"
r-base = ">=4.3"
r-ggplot2 = ">=3.5"
bioconductor-deseq2 = ">=1.42"

[tasks]
analyze = "bash src/run_analysis.sh"
merge = "python src/merge_reads.py"
trim = "bash src/trim_reads.sh"
count = "python src/count_reads.py"
deseq2 = "Rscript src/deseq2.r"
